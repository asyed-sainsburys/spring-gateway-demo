server:
  port: 8080

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${MY_AZURE_CLIENT_ID}
            client-secret: ${MY_AZURE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - api://a43434b4-8f3a-4213-86dc-5c9b0a521ed3/access_as_user
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${MY_AZURE_TENANT_ID}/v2.0
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${MY_AZURE_TENANT_ID}/v2.0

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user
              uri: http://localhost:8081
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
                - TokenRelay=
            - id: report
              uri: http://localhost:8082
              predicates:
                - Path=/report/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.servlet.function: DEBUG

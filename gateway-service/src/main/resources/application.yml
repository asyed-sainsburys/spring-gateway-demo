server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/local-dev

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user
              uri: http://localhost:8081
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1

            - id: report
              uri: http://localhost:8082
              predicates:
                - Path=/report/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
